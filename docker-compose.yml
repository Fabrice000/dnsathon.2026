services:
  # -------------------------------------------------------------
  # Backend Récursif : Unbound
  # Rôle : Résolution récursive, validation DNSSEC, filtrage RPZ
  # -------------------------------------------------------------
  unbound:
    image: mvance/unbound:latest
    container_name: dnsaton-unbound
    restart: unless-stopped
    privileged: true
    volumes:
      - ./unbound/unbound.conf:/opt/unbound/etc/unbound/unbound.conf:ro
      - ./blocklists:/opt/unbound/etc/unbound/blocklists:rw
      - ./blueteam/scripts_contremesures:/root/contremesures:rw
    networks:
      dns_internal:
        ipv4_address: 172.28.0.2

  # -------------------------------------------------------------
  # Frontend Sécurisé : DNSdist
  # Rôle : Terminaison DoH / DoT, anti-DDoS (RRL), métriques
  # -------------------------------------------------------------
  dnsdist:
    image: powerdns/dnsdist-19:latest
    container_name: dnsaton-dnsdist
    restart: unless-stopped
    ports:
      - "53:53/udp"     # DNS classique UDP
      - "53:53/tcp"     # DNS classique TCP
      - "853:853/tcp"   # DNS-over-TLS (DoT)
      - "443:443/tcp"   # DNS-over-HTTPS (DoH)
      - "8083:8083/tcp" # Console Web & Métriques Prometheus
    volumes:
      - ./dnsdist/dnsdist.conf:/etc/dnsdist/dnsdist.conf:ro
      - ./certs:/etc/dnsdist/certs:ro
    depends_on:
      - unbound
    networks:
      dns_internal:
        ipv4_address: 172.28.0.3

  # -------------------------------------------------------------
  # Collecteur de métriques : Prometheus
  # -------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: dnsaton-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - dnsdist
    networks:
      dns_internal:
        ipv4_address: 172.28.0.4

  # -------------------------------------------------------------
  # Tableau de bord visuel : Grafana
  # -------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: dnsaton-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      dns_internal:
        ipv4_address: 172.28.0.5

  # -------------------------------------------------------------
  # Blue Team - Machine de Monitoring / SOC (Activité 3)
  # Rôle : Capture tcpdump, moteur de détection IDS, contre-mesures
  # -------------------------------------------------------------
  monitoring:
    build:
      context: .
      dockerfile: ./blueteam/Dockerfile.node
    container_name: blueteam-monitoring
    restart: unless-stopped
    stdin_open: true
    tty: true
    privileged: true
    network_mode: "service:unbound"
    volumes:
      - ./blueteam/scripts_detection:/root/detection:rw
      - ./blueteam/scripts_contremesures:/root/contremesures:rw

  # -------------------------------------------------------------
  # Blue Team - Machine Attaquant (Simulateur des 4 attaques DNS)
  # Rôle : Génère DDoS, Exfiltration, Tunneling, Poisoning
  # -------------------------------------------------------------
  attacker:
    build:
      context: .
      dockerfile: ./blueteam/Dockerfile.node
    container_name: blueteam-attacker
    restart: unless-stopped
    stdin_open: true
    tty: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./blueteam/scripts_attaques:/root/attacks:rw
      - ./blueteam/scripts_demo:/root/demo:rw
    networks:
      dns_internal:
        ipv4_address: 172.28.0.20

networks:
  dns_internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
